name: Extract BDC Data

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      years_back:
        description: 'Years of data to extract (0 = latest quarter only)'
        required: false
        default: '0'
        type: string
      tickers:
        description: 'Specific tickers (comma-separated, optional - leave empty for all)'
        required: false
        type: string
  
  schedule:
    # Run on the 15th of each month at 8 AM UTC (after most quarterly filings)
    - cron: '0 8 15 * *'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Extract BDC data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: |
          YEARS_BACK="${{ github.event.inputs.years_back || '0' }}"
          TICKERS="${{ github.event.inputs.tickers || '' }}"
          
          if [ -n "$TICKERS" ]; then
            # Convert comma-separated to space-separated
            TICKER_LIST=$(echo $TICKERS | tr ',' ' ')
            python process_all_bdcs.py --years-back $YEARS_BACK --tickers $TICKER_LIST
          else
            # Extract all BDCs
            python process_all_bdcs.py --years-back $YEARS_BACK
          fi
      
      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain frontend/public/data/)" ]; then
            git add frontend/public/data/
            git commit -m "chore: update BDC data [skip ci]"
            git push
          else
            echo "No data changes to commit"
          fi
      
      - name: Create summary
        if: always()
        run: |
          echo "## Data Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Years back**: ${{ github.event.inputs.years_back || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tickers**: ${{ github.event.inputs.tickers || 'All' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
