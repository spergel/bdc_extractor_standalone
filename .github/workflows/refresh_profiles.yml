name: Refresh BDC Profiles

permissions:
  contents: write

on:
  schedule:
    # Daily at 6:17 AM UTC (before US market open)
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # Use PAT if the org restricts GITHUB_TOKEN; create repo secret REPO_PUSH_TOKEN (fine-grained: Contents RW).
        with:
          token: ${{ secrets.REPO_PUSH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install yfinance
        run: pip install yfinance

      - name: Refresh profiles
        run: python scripts/refresh_bdc_profiles.py

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain frontend/public/data/)" ]; then
            git add frontend/public/data/*/profile.json
            git commit -m "chore: refresh BDC market profiles [skip ci]"
            git push origin HEAD:"$BRANCH"
          else
            echo "No profile changes to commit"
          fi
